<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Makaan4U Private Client Advisory</title>
  <meta name="theme-color" content="#AA4824" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #1C1917;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #FFFFFF;
      border: 1px solid #E7E5E4;
      border-radius: 4px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(78, 36, 21, 0.05);
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, #FFFDF8, #FAF1E4);
      border: 1.5px solid #F59E0B;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-icon svg {
      width: 36px;
      height: 36px;
    }
    .tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #AA4824;
      margin-bottom: 8px;
      display: inline-block;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1C1917;
      margin-bottom: 12px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #78716C;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      background: #AA4824;
      color: #FFFFFF;
      border: none;
      padding: 12px 20px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #8F3719;
    }
    .btn-secondary {
      background: #F5F5F4;
      color: #44403C;
      border: 1px solid #E7E5E4;
      padding: 11px 20px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover {
      background: #E7E5E4;
      border-color: #D6D3D1;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #A8A29E;
      margin-top: 20px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #F59E0B;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#AA4824" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <span class="tag">Makaan4U Network Advisory</span>
    <h1>You Are Currently Offline</h1>
    <p>
      Your device lost active internet connectivity. Previously viewed property dossiers and your local shortlist remain accessible from cache.
    </p>

    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">
        Retry Connection
      </button>
      <a href="/account/saved" class="btn-secondary">
        View Cached Shortlist
      </a>
      <a href="/" class="btn-secondary">
        Return to Home Shell
      </a>
    </div>

    <div class="status-pill">
      <span class="dot"></span>
      <span>Waiting for network link to re-establish...</span>
    </div>
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
